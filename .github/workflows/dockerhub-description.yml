name: Sync Docker Hub Description

# Keep the bansur/router Docker Hub overview page in sync with DOCKERHUB.md.
# (The full README.md is ~60k characters — over Docker Hub's 25k description
# limit — so a dedicated short overview file is synced instead.)

on:
  push:
    branches:
      - main
    paths:
      - "DOCKERHUB.md"
  workflow_dispatch:

jobs:
  sync:
    name: Sync description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Docker Hub secrets are configured
        id: gate
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME secret not set — skipping Docker Hub description sync."
          fi

      - name: Update Docker Hub description
        if: steps.gate.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: bansur/router
          short-description: "Free AI router & token saver: one OpenAI-compatible endpoint for 40+ AI providers"
          readme-filepath: ./DOCKERHUB.md
